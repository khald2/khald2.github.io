<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خالد ثائر رشيد | الموقع الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #090a0f;
            --primary-color: #00f0ff;
            --secondary-color: #8a2be2;
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a24 0%, var(--bg-color) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1), opacity 1s ease;
        }

        .welcome-text {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            text-align: center;
        }

        .welcome-subtext {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .cyber-btn {
            background: transparent;
            color: var(--primary-color);
            font-size: 1.2rem;
            font-weight: 700;
            padding: 12px 40px;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cyber-btn:hover {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
            transform: translateY(-3px);
        }

        #main-content {
            display: flex;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.2s ease;
        }

        #main-content.active {
            opacity: 1;
            visibility: visible;
        }

        .split-pane {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            position: relative;
        }

        .right-pane {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.05) 0%, transparent 100%);
            border-left: 1px solid var(--glass-border);
        }

        .left-pane {
            background: linear-gradient(-135deg, rgba(0, 240, 255, 0.05) 0%, transparent 100%);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 35px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.8s ease;
        }

        .glass-card.show {
            transform: translateY(0);
            opacity: 1;
        }

        .profile-title {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .profile-subtitle {
            color: var(--primary-color);
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .info-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .info-list li {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .info-list i {
            color: var(--secondary-color);
            font-size: 1.1rem;
        }

        .social-links {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .social-links a {
            color: var(--text-main);
            text-decoration: none;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            font-size: 1.1rem;
            transition: 0.3s;
            border: 1px solid var(--glass-border);
        }

        .social-links a:hover {
            background: var(--primary-color);
            color: #000;
            transform: translateY(-3px);
        }

        .main-content-title {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--primary-color);
            border-bottom: 2px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 8px;
            display: inline-block;
        }

        .typewriter-text {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-muted);
            min-height: 120px;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 18px;
            background-color: var(--primary-color);
            animation: blink 0.8s infinite;
            vertical-align: middle;
            margin-right: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                height: auto;
            }
            #main-content {
                flex-direction: column;
                height: auto;
            }
            .split-pane {
                min-height: 100vh;
                padding: 20px;
            }
            .right-pane {
                border-left: none;
                border-bottom: 1px solid var(--glass-border);
            }
            .welcome-text {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <h1 class="welcome-text">مرحباً بك</h1>
        <p class="welcome-subtext">النظام جاهز للتشغيل. اضغط للبدء</p>
        <button id="start-btn" class="cyber-btn">
            <i class="fa-solid fa-power-off"></i>
            <span>تشغيل النظام</span>
        </button>
    </div>

    <div id="main-content">
        <div class="split-pane right-pane">
            <div class="glass-card" id="card-right">
                <h2 class="profile-title">خالد ثائر رشيد</h2>
                <p class="profile-subtitle">System Administrator & Developer</p>
                
                <ul class="info-list">
                    <li><i class="fa-solid fa-envelope"></i> khald1mk0@gmail.com</li>
                    <li><i class="fa-solid fa-phone"></i> 07803494710</li>
                </ul>

                <div class="social-links">
                    <a href="https://github.com/khald2" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
                    <a href="https://discord.com/users/vb_e" target="_blank" title="Discord"><i class="fa-brands fa-discord"></i></a>
                    <a href="https://instagram.com/vp_e1" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://tiktok.com/@vb_e11" target="_blank" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
                </div>
            </div>
        </div>

        <div class="split-pane left-pane">
            <div class="glass-card" id="card-left">
                <h3 class="main-content-title">الكلام الأساسي</h3>
                <div class="typewriter-text">
                    <span id="typed-output"></span><span class="cursor"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const welcomeScreen = document.getElementById('welcome-screen');
        const mainContent = document.getElementById('main-content');
        const startBtn = document.getElementById('start-btn');
        const cardRight = document.getElementById('card-right');
        const cardLeft = document.getElementById('card-left');
        const typedOutput = document.getElementById('typed-output');

        const textToType = "هذه هي المساحة المخصصة للكلام الأساسي. تم تصميم هذا النظام ليوفر لك أقوى أداء وأجمل واجهة برمجية تتناسب مع تطلعاتك التقنية...";
        let typeIndex = 0;

        function typeWriter() {
            if (typeIndex < textToType.length) {
                typedOutput.innerHTML += textToType.charAt(typeIndex);
                typeIndex++;
                setTimeout(typeWriter, 40);
            } else {
                document.querySelector('.cursor').style.display = 'none';
            }
        }

        startBtn.addEventListener('click', () => {
            welcomeScreen.style.transform = 'translateY(-100vh)';
            welcomeScreen.style.opacity = '0';

            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                mainContent.classList.add('active');
                
                setTimeout(() => {
                    cardRight.classList.add('show');
                    cardLeft.classList.add('show');
                    setTimeout(typeWriter, 600);
                }, 200);

            }, 800);
        });
    </script>
</body>
</html>
